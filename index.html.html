.btn-primary{background:#3B82F6;color:#fff;border:none;padding:7px 14px;border-radius:7px;font-size:12.5px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-family:'DM Sans',sans-serif;transition:background 200ms}

.btn-secondary{background:rgba(255,255,255,0.06);color:#CBD5E1;border:1px solid rgba(255,255,255,0.1);padding:7px 12px;border-radius:7px;font-size:12.5px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all 200ms;display:inline-flex;align-items:center;gap:6px}

.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}

.kpi-icon{position:absolute;right:14px;top:14px;width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px}
.panels{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.panel{background:#1A1D24;border:1px solid rgba(255,255,255,0.06);border-radius:10px;padding:18px}

.funnel-fill{height:100%;border-radius:4px;transition:width 600ms ease}
.funnel-count{font-size:11px;font-family:'Space Mono',monospace;color:#9CA3AF;width:24px;text-align:right}
.activity-item{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.04)}

.act-icon{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;margin-top:1px}
.act-body{flex:1}
.act-lead{font-size:12.5px;color:#CBD5E1;font-weight:500}
.act-note{font-size:11.5px;color:#6B7280;margin-top:1px}
.act-date{font-size:10px;font-family:'Space Mono',monospace;color:#4B5563;margin-top:2px}
.filter-bar{display:flex;gap:8px;margin-bottom:16px;align-items:center;flex-wrap:wrap}
.search-input{background:#1A1D24;border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:7px 12px;color:#CBD5E1;font-size:13px;font-family:'DM Sans',sans-serif;outline:none;min-width:180px;transition:border 200ms}

select.filter-sel{background:#1A1D24;border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:7px 12px;color:#CBD5E1;font-size:12.5px;font-family:'DM Sans',sans-serif;outline:none;cursor:pointer}
.leads-table{width:100%;border-collapse:collapse}
.leads-table th{font-size:11px;text-transform:uppercase;letter-spacing:0.7px;color:#4B5563;font-weight:500;padding:8px 12px;text-align:left;border-bottom:1px solid rgba(255,255,255,0.06);white-space:nowrap}

.s-contato{background:rgba(245,158,11,0.15);color:#F59E0B}
.s-reuniao{background:rgba(139,92,246,0.15);color:#8B5CF6}
.s-proposta{background:rgba(6,182,212,0.15);color:#06B6D4}
.s-fechado{background:rgba(16,185,129,0.15);color:#10B981}

.mono{font-family:'Space Mono',monospace;font-size:11.5px;color:#4B5563}
.drawer-overlay{position:absolute;inset:0;background:rgba(0,0,0,0.5);z-index:50;opacity:0;transition:opacity 200ms;pointer-events:none}

.drawer{position:absolute;right:0;top:0;bottom:0;width:370px;background:#111318;border-left:1px solid rgba(255,255,255,0.08);z-index:51;transform:translateX(100%);transition:transform 280ms ease;overflow-y:auto}

.timeline-item{display:flex;gap:10px;margin-bottom:12px;padding-left:4px}

.kcard-seg{font-size:11px;color:#6B7280;margin-bottom:8px}
.kcard-value{font-family:'Space Mono',monospace;font-size:11px;color:#10B981;margin-bottom:6px}

.kcard-days{font-size:10px;color:#4B5563;font-family:'Space Mono',monospace}

.p-alta{background:rgba(239,68,68,0.15);color:#EF4444}
.p-media{background:rgba(245,158,11,0.15);color:#F59E0B}
.p-baixa{background:rgba(16,185,129,0.15);color:#10B981}

.cal-wrapper{background:#1A1D24;border:1px solid rgba(255,255,255,0.06);border-radius:10px;padding:16px}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cal-month{font-size:14px;font-weight:600;color:#E2E8F0}
.cal-nav{background:none;border:1px solid rgba(255,255,255,0.1);border-radius:6px;color:#9CA3AF;cursor:pointer;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:14px}
.cal-nav:hover{background:rgba(255,255,255,0.06)}
.cal-days-header{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:6px}
.cal-day-name{font-size:10px;text-align:center;color:#4B5563;font-weight:500;padding:4px 0;text-transform:uppercase;letter-spacing:0.5px}

.cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:12.5px;color:#6B7280;border-radius:7px;cursor:pointer;transition:all 150ms;position:relative}

.modal{background:#1A1D24;border:1px solid rgba(255,255,255,0.1);border-radius:12px;width:400px;padding:24px;max-height:90vh;overflow-y:auto}

.modal-field{margin-bottom:14px}

.input-dark{width:100%;background:#111318;border:1px solid rgba(255,255,255,0.1);border-radius:7px;padding:8px 12px;color:#CBD5E1;font-size:13px;font-family:'DM Sans',sans-serif;outline:none;transition:border 200ms}

.toast{position:fixed;bottom:24px;right:24px;background:#10B981;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;font-weight:500;z-index:200;display:flex;align-items:center;gap:8px;transform:translateY(80px);transition:transform 300ms ease;pointer-events:none;box-shadow:0 4px 20px rgba(16,185,129,0.4)}
.toast.show{transform:translateY(0)}
.seg-dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle}
.report-table{width:100%;border-collapse:collapse}
.report-table th{font-size:11px;text-transform:uppercase;letter-spacing:0.7px;color:#4B5563;font-weight:500;padding:8px 12px;text-align:left;border-bottom:1px solid rgba(255,255,255,0.06)}

.empty-state{text-align:center;padding:48px 24px;color:#4B5563}
.empty-state i{font-size:36px;display:block;margin:0 auto 10px}
</style>
</head>

function renderAgenda(ca) {
  const months=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const daysInMonth=new Date(state.calYear,state.calMonth+1,0).getDate();
  const firstDay=new Date(state.calYear,state.calMonth,1).getDay();
  const dayNames=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  const taskDays=[...new Set(state.tasks.map(t=>t.dia))];
  const todayTasks=state.tasks.filter(t=>t.dia===state.selectedDay);
  const prevDays=new Date(state.calYear,state.calMonth,0).getDate();

  let calDays='';
  for(let i=0;i<firstDay;i++) calDays+=`<div class="cal-day other-month">${prevDays-firstDay+i+1}</div>`;
  for(let d=1;d<=daysInMonth;d++){
    const isToday=d===7&&state.calMonth===5;
    const isSel=d===state.selectedDay;
    const hasTask=taskDays.includes(d);
    calDays+=`<div class="cal-day${isToday?' today':''}${isSel?' selected':''}${hasTask?' has-task':''}" data-day="${d}">${d}</div>`;
  }

  ca.innerHTML=`
  <div style="display:flex;justify-content:flex-end;margin-bottom:14px">
    <button class="btn-primary" id="btn-new-task"><i class="ti ti-plus"></i> Nova Tarefa</button>
  </div>
  <div class="calendar-grid">
    <div class="cal-wrapper">
      <div class="cal-header">
        <button class="cal-nav" id="cal-prev"><i class="ti ti-chevron-left"></i></button>
        <div class="cal-month">${months[state.calMonth]} ${state.calYear}</div>
        <button class="cal-nav" id="cal-next"><i class="ti ti-chevron-right"></i></button>
      </div>
      <div class="cal-days-header">${dayNames.map(d=>`<div class="cal-day-name">${d}</div>`).join('')}</div>
      <div class="cal-days" id="cal-days">${calDays}</div>
    </div>
    <div class="tasks-panel">
      <div class="panel-title" style="margin-bottom:12px"><i class="ti ti-list-check" style="color:#3B82F6"></i> Dia ${state.selectedDay} — ${todayTasks.length} tarefa(s)</div>
      ${todayTasks.length===0?`<div class="empty-state" style="padding:24px"><i class="ti ti-check-circle" style="color:#10B981"></i>Nenhuma tarefa neste dia</div>`:''}
      ${todayTasks.map(t=>`<div class="task-item">
        <div class="task-check${t.done?' done':''}" data-toggle="${t.id}">${t.done?'<i class="ti ti-check" style="font-size:10px;color:#fff"></i>':''}</div>
        <div>
          <div class="task-lead" style="${t.done?'text-decoration:line-through;color:#4B5563':''}">${t.lead}</div>
          <div class="task-meta">
            <span class="task-type-badge ${tipoCls[t.tipo]||''}">${t.tipo}</span>
            <span style="font-family:'Space Mono',monospace;font-size:11px">${t.hora}</span>
          </div>
          ${t.obs?`<div style="font-size:11px;color:#4B5563;margin-top:3px">${t.obs}</div>`:''}
        </div>
      </div>`).join('')}
    </div>
  </div>`;

  document.getElementById('cal-prev').addEventListener('click',()=>{
    state.calMonth=state.calMonth===0?11:state.calMonth-1;
    if(state.calMonth===11) state.calYear--;
    renderAgenda(ca);
  });
  document.getElementById('cal-next').addEventListener('click',()=>{
    state.calMonth=state.calMonth===11?0:state.calMonth+1;
    if(state.calMonth===0) state.calYear++;
    renderAgenda(ca);
  });
  document.getElementById('cal-days').addEventListener('click',e=>{
    const d=e.target.closest('[data-day]');
    if(d){ state.selectedDay=parseInt(d.dataset.day); renderAgenda(ca); }
  });
  ca.querySelectorAll('[data-toggle]').forEach(el=>{
    el.addEventListener('click',()=>{
      const t=state.tasks.find(t=>t.id===parseInt(el.dataset.toggle));
      if(t){ t.done=!t.done; renderAgenda(ca); }
    });
  });
  document.getElementById('btn-new-task').addEventListener('click',openModalTask);
}

function openModalTask() {
  const mo=document.getElementById('modal-overlay');
  mo.innerHTML=`<div class="modal">
    <div class="modal-title">Nova Tarefa <button id="close-modal" style="background:none;border:none;color:#6B7280;cursor:pointer;font-size:18px"><i class="ti ti-x"></i></button></div>
    <div class="modal-field"><label class="modal-label">Tipo</label>
      <select class="input-dark" id="m-tipo"><option>Ligação</option><option>WhatsApp</option><option>Reunião</option><option>E-mail</option></select></div>
    <div class="modal-field"><label class="modal-label">Lead</label>
      <select class="input-dark" id="m-lead">${MOCK.leads.map(l=>`<option>${l.empresa}</option>`).join('')}</select></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div class="modal-field"><label class="modal-label">Dia</label><input type="number" class="input-dark" id="m-dia" value="${state.selectedDay}" min="1" max="31"></div>
      <div class="modal-field"><label class="modal-label">Hora</label><input type="time" class="input-dark" id="m-hora" value="09:00"></div>
    </div>
    <div class="modal-field"><label class="modal-label">Observação</label><input class="input-dark" id="m-obs" placeholder="Nota opcional..."></div>
    <button class="btn-primary" style="width:100%;margin-top:6px;justify-content:center" id="btn-save-task"><i class="ti ti-check"></i> Salvar Tarefa</button>
  </div>`;
  mo.classList.add('open');
  document.getElementById('close-modal').addEventListener('click',closeModal);
  document.getElementById('btn-save-task').addEventListener('click',()=>{
    const tipo=document.getElementById('m-tipo').value;
    const lead=document.getElementById('m-lead').value;
    const dia=parseInt(document.getElementById('m-dia').value)||state.selectedDay;
    const hora=document.getElementById('m-hora').value||'09:00';
    const obs=document.getElementById('m-obs').value;
    state.tasks.push({id:Date.now(),lead,tipo,hora,dia,done:false,obs});
    closeModal(); showToast('Tarefa criada!');
    renderAgenda(document.getElementById('content-area'));
  });
}

function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); }

function renderRelatorios(ca) {
  const segs=['Clínica Odontológica','Concessionária','Delivery','Loja Natural'];
  const segData=segs.map(s=>({
    seg:s,
    leads:MOCK.leads.filter(l=>l.segmento===s).length,
    reunioes:MOCK.leads.filter(l=>l.segmento===s&&['Reunião Agendada','Proposta Enviada','Fechado'].includes(l.status)).length,
    fechamentos:MOCK.leads.filter(l=>l.segmento===s&&l.status==='Fechado').length,
    receita:MOCK.leads.filter(l=>l.segmento===s&&l.status==='Fechado').reduce((a,l)=>a+l.valor,0),
    ticket:Math.round(MOCK.leads.filter(l=>l.segmento===s).reduce((a,l)=>a+l.valor,0)/Math.max(MOCK.leads.filter(l=>l.segmento===s).length,1)),
  }));
  const total=MOCK.leads.length;
  const meses=['Jan','Fev','Mar','Abr','Mai','Jun'];
  const abertos=[4,6,8,10,13,15];
  const fechadosMes=[0,0,1,1,2,2];
  const maxB=15;
  const cidades=['Uberlândia','Uberaba','Araxá'];
  const maxC=Math.max(...cidades.map(c=>MOCK.leads.filter(l=>l.cidade===c).length),1);

  // Pie chart paths
  let pieHTML='';
  let offset=0;
  const r=45,cx=55,cy=55,circ=2*Math.PI*r;
  segs.forEach(s=>{
    const pct=MOCK.leads.filter(l=>l.segmento===s).length/total;
    const dash=pct*circ;
    pieHTML+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${segCores[s]}" stroke-width="20" stroke-dasharray="${dash.toFixed(2)} ${(circ-dash).toFixed(2)}" stroke-dashoffset="${(-offset*circ).toFixed(2)}" transform="rotate(-90 ${cx} ${cy})"/>`;
    offset+=pct;
  });

  ca.innerHTML=`
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px">
    <div class="panel">
      <div class="panel-title"><i class="ti ti-chart-pie" style="color:#8B5CF6"></i> Leads por Segmento</div>
      <div style="display:flex;align-items:center;gap:20px">
        <svg width="110" height="110" viewBox="0 0 110 110" style="flex-shrink:0">${pieHTML}</svg>
        <div style="flex:1">
          ${segs.map(s=>{const c=MOCK.leads.filter(l=>l.segmento===s).length;return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12px;color:#9CA3AF">
            <span class="seg-dot" style="background:${segCores[s]};flex-shrink:0"></span>
            <span style="flex:1;font-size:11px">${s.length>20?s.substring(0,18)+'…':s}</span>
            <span style="font-family:'Space Mono',monospace;font-size:11px;color:#CBD5E1">${c}</span>
          </div>`;}).join('')}
        </div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-title"><i class="ti ti-trending-up" style="color:#3B82F6"></i> Evolução — 6 meses</div>
      <svg width="100%" height="120" viewBox="0 0 290 120" preserveAspectRatio="xMidYMid meet">
        ${meses.map((m,i)=>{
          const x=20+i*45;
          const hA=Math.round((abertos[i]/maxB)*90);
          const hF=Math.round((fechadosMes[i]/maxB)*90);
          return `<rect x="${x}" y="${110-hA}" width="14" height="${hA}" fill="#3B82F6" opacity="0.8" rx="2"/>
          <rect x="${x+16}" y="${110-hF}" width="14" height="${hF||2}" fill="#10B981" opacity="0.8" rx="2"/>
          <text x="${x+14}" y="118" fill="#4B5563" font-size="9" text-anchor="middle" font-family="DM Sans">${m}</text>`;
        }).join('')}
        <line x1="14" y1="110" x2="278" y2="110" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      </svg>
      <div style="display:flex;gap:16px;margin-top:8px;font-size:11px">
        <span style="color:#3B82F6;display:flex;align-items:center;gap:5px"><span style="width:10px;height:10px;background:#3B82F6;border-radius:2px;opacity:.8;display:inline-block"></span>Abertos</span>
        <span style="color:#10B981;display:flex;align-items:center;gap:5px"><span style="width:10px;height:10px;background:#10B981;border-radius:2px;opacity:.8;display:inline-block"></span>Fechados</span>
      </div>
    </div>
  </div>
  <div class="panel" style="margin-bottom:16px">
    <div class="panel-title"><i class="ti ti-map-pin" style="color:#F59E0B"></i> Performance por Cidade</div>
    ${cidades.map(c=>{
      const count=MOCK.leads.filter(l=>l.cidade===c).length;
      const fec=MOCK.leads.filter(l=>l.cidade===c&&l.status==='Fechado').length;
      const rec=MOCK.leads.filter(l=>l.cidade===c&&l.status==='Fechado').reduce((a,l)=>a+l.valor,0);
      return `<div class="funnel-bar" style="margin-bottom:14px">
        <div style="width:100px;font-size:12px;color:#9CA3AF;flex-shrink:0">${c}</div>
        <div class="funnel-track" style="height:10px"><div class="funnel-fill" style="width:${Math.round((count/maxC)*100)}%;background:#3B82F6"></div></div>
        <div style="font-size:11px;font-family:'Space Mono',monospace;color:#9CA3AF;width:160px;text-align:right;white-space:nowrap">${count} leads · ${fec} fechados · R$ ${rec.toLocaleString()}</div>
      </div>`;
    }).join('')}
  </div>
  <div style="background:#1A1D24;border:1px solid rgba(255,255,255,0.06);border-radius:10px;overflow:hidden">
    <table class="report-table" style="width:100%">
      <thead><tr><th>Segmento</th><th>Leads</th><th>Reuniões</th><th>Fechamentos</th><th>Receita Est.</th><th>Ticket Médio</th></tr></thead>
      <tbody>
      ${segData.map(s=>`<tr>
        <td><span class="seg-dot" style="background:${segCores[s.seg]}"></span>${s.seg}</td>
        <td class="mono" style="color:#CBD5E1">${s.leads}</td>
        <td class="mono" style="color:#CBD5E1">${s.reunioes}</td>
        <td><span style="color:#10B981;font-family:'Space Mono',monospace">${s.fechamentos}</span></td>
        <td style="color:#10B981;font-family:'Space Mono',monospace;font-size:12px">R$ ${s.receita.toLocaleString()}/mês</td>
        <td class="mono" style="color:#CBD5E1">R$ ${s.ticket.toLocaleString()}</td>
      </tr>`).join('')}
      </tbody>
    </table>
  </div>`;
}

  ca.innerHTML=`<div style="max-width:520px">
    <div style="background:#1A1D24;border:1px solid rgba(255,255,255,0.06);border-radius:10px;padding:20px;margin-bottom:16px">
      <div class="panel-title"><i class="ti ti-user" style="color:#3B82F6"></i> Perfil do Usuário</div>
      <div class="modal-field"><label class="modal-label">Nome</label><input class="input-dark" value="Victor Hugo" id="cfg-nome"></div>
      <div class="modal-field"><label class="modal-label">Agência</label><input class="input-dark" value="Nexus Digital Meta" id="cfg-agencia"></div>
      <div class="modal-field"><label class="modal-label">E-mail</label><input class="input-dark" value="victor@nexusdigitalmeta.com.br" id="cfg-email"></div>
      <div class="modal-field"><label class="modal-label">Cargo</label><input class="input-dark" value="Traffic Manager" id="cfg-cargo"></div>
      <button class="btn-primary" id="btn-save-cfg"><i class="ti ti-check"></i> Salvar Perfil</button>
    </div>
    <div style="background:#1A1D24;border:1px solid rgba(255,255,255,0.06);border-radius:10px;padding:20px;margin-bottom:16px">
      <div class="panel-title"><i class="ti ti-map-pin" style="color:#10B981"></i> Cidades de Prospecção</div>
      ${['Uberlândia','Uberaba','Araxá'].map(c=>`<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.04)">
        <i class="ti ti-check" style="color:#10B981;font-size:14px"></i>
        <span style="font-size:13px;color:#CBD5E1">${c}</span>
        <span style="margin-left:auto;font-size:11px;color:#4B5563;font-family:'Space Mono',monospace">${MOCK.leads.filter(l=>l.cidade===c).length} leads</span>
      </div>`).join('')}
      <button class="btn-secondary" style="margin-top:12px"><i class="ti ti-plus"></i> Adicionar Cidade</button>
    </div>
    <div style="background:#1A1D24;border:1px solid rgba(255,255,255,0.06);border-radius:10px;padding:20px">
      <div class="panel-title"><i class="ti ti-tag" style="color:#F59E0B"></i> Segmentos Ativos</div>
      ${Object.entries(segCores).map(([s,c])=>`<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.04)">
        <span class="seg-dot" style="background:${c}"></span>
        <span style="font-size:13px;color:#CBD5E1">${s}</span>
        <span style="margin-left:auto;font-size:11px;color:#4B5563;font-family:'Space Mono',monospace">${MOCK.leads.filter(l=>l.segmento===s).length} leads</span>
      </div>`).join('')}
    </div>
  </div>`;
  document.getElementById('btn-save-cfg').addEventListener('click',()=>showToast('Perfil salvo com sucesso!'));
}

function showToast(msg) {
  const t=document.getElementById('toast');
  document.getElementById('toast-msg').textContent=msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2800);
}

render();
</script>
</body>
</html>
